<app-to-do-create-item></app-to-do-create-item>

<div class="backlog-content">
  <div class="list-wrapper">
    <mat-form-field class="status-filter">
      <mat-label i18n="@@status">Status</mat-label>
      <mat-select [(ngModel)]="selectedStatus">
        @for (status of statuses; track status) {
          <mat-option [value]="status.value">{{ status.viewValue }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <ul class="list">
      @for (task of filteredTasks(); track task.id) {
        <li
          app-to-do-item
          tabindex="0"
          appTooltip="Show description"
          i18n-appTooltip="@@showDescription"
          routerLinkActive="selected"
          [routerLink]="['/backlog', task.id]"
          [task]="task"
          (delete)="deleteTask(task.id)"
          (statusChange)="changeStatus(task.id, $event)"
        ></li>
      }
    </ul>
  </div>

  <router-outlet />
</div>
