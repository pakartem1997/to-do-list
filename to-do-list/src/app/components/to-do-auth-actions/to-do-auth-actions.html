<div class="auth-actions">
  @if (displayName(); as displayName) {
    <app-to-do-user-avatar [name]="displayName" />
    <span>{{ displayName }}</span>
    <button matButton (click)="logout()">Exit</button>
  } @else {
    <button mat-button type="button" (click)="openLogin()">Login</button>
    <button mat-flat-button type="button" (click)="openRegistration()">Registration</button>
  }
</div>
