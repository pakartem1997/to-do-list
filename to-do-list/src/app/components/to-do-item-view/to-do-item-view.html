@let taskData = task();
@let completed = isCompleted();
@let statusActionText = completed ? returnToProgress : completeTask;

<div class="task-status">
  <input
    #statusCheckbox
    class="cursor-pointer"
    app-checkbox
    type="checkbox"
    [appTooltip]="statusActionText"
    [checked]="completed"
    (checkedChange)="onStatusChange(!completed)"
  />

  {{ statusActionText }}
</div>

<hr />

<div class="description-text">
  {{ taskData.description }}
</div>
