@let description = data.textDesription;

@if (description) {
  <h2 class="description-header" mat-dialog-title><mat-icon>description</mat-icon> Description task</h2>
  <mat-dialog-content>
    {{ description }}
  </mat-dialog-content>
} @else {
  <h2 mat-dialog-title><mat-icon>description</mat-icon> Нет описания</h2>
  <mat-dialog-content>
    <p>Для этой задачи пока не добавлено описание.</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton mat-dialog-close type="button">Добавить описание</button>
  </mat-dialog-actions>
}
