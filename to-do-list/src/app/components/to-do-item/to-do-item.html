@if (isEdit()) {
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <input class="title-input" matInput [(ngModel)]="inputValue" />
  </mat-form-field>
  <button
    app-button
    appTooltip="Edit Task"
    i18n-appTooltip="@@editTaskTooltip"
    i18n="@@save"
    type="button"
    class="btn"
    variant="add"
    [disabled]="isInputEmpty()"
    (click)="onClick()"
  >
    Save
  </button>
} @else {
  <input
    #statusCheckbox
    class="cursor-pointer"
    app-checkbox
    type="checkbox"
    [(ngModel)]="isCompleted"
    [appTooltip]="isCompleted() ? returnToProgress : completeTask"
    (click)="$event.stopPropagation()"
    (dblclick)="$event.stopPropagation()"
    (change)="onStatusChange(statusCheckbox.checked)"
  />
  <span class="task-text">
    {{ task().text }}
  </span>
  <button
    app-button
    appTooltip="Delete Task"
    i18n-appTooltip="@@deleteTaskTooltip"
    i18n="@@delete"
    type="button"
    class="btn"
    variant="delete"
    (click)="deleteTask($event)"
  >
    Delete
  </button>
}
